<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Toon Translation Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg-dark:#0f172a;--bg-panel:#1e293b;--bg-card:#334155;--border-color:#475569;--accent:#6366f1;--text-main:#f8fafc;--text-muted:#94a3b8;--warning:#f59e0b;--success:#10b981}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter','Noto Sans Bengali',sans-serif}
body{background:var(--bg-dark);color:var(--text-main);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:rgba(30,41,59,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-color);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.brand{display:flex;align-items:center;gap:12px}.brand-icon{background:linear-gradient(135deg,#6366f1,#a855f7);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}.brand-title h1{font-size:18px}.brand-title p{font-size:12px;color:var(--text-muted)}
.header-actions{display:flex;align-items:center;gap:12px}.btn{background:var(--bg-card);color:#fff;border:1px solid var(--border-color);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}.btn-primary{background:linear-gradient(135deg,#6366f1,#4f46e5);border:none}.btn-success{background:linear-gradient(135deg,#10b981,#059669);border:none}.btn:disabled{opacity:.5;cursor:not-allowed}
.app-container{display:flex;flex:1;overflow:hidden}.stage-container{flex:1;display:flex;flex-direction:column;background:#090d16;position:relative;overflow:hidden}.stage-toolbar{padding:8px 16px;background:rgba(30,41,59,.5);border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.view-toggle{display:flex;background:var(--bg-dark);padding:3px;border-radius:8px;border:1px solid var(--border-color)}.toggle-btn{padding:6px 12px;font-size:12px;border-radius:6px;cursor:pointer;background:transparent;color:var(--text-muted);border:none}.toggle-btn.active{background:var(--accent);color:#fff}
.zoom-controls{display:flex;align-items:center;gap:4px}.zoom-btn,.zoom-level{height:30px;min-width:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;background:var(--bg-dark);color:#fff;border:1px solid var(--border-color);border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}.zoom-level{min-width:58px}
.stage-view{flex:1;overflow:auto;padding:24px;position:relative}.stage-view.zoomed{padding:24px}.multi-canvas{width:max-content;min-width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center}.page-wrapper{position:relative;flex:0 0 auto;margin:0;padding:0;line-height:0;box-shadow:0 20px 40px rgba(0,0,0,.6)}.page-wrapper img{display:block;width:auto;height:auto;max-width:none;max-height:none;user-select:none;-webkit-user-drag:none}.overlay-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}.bbox-rect{fill:rgba(99,102,241,.15);stroke:#818cf8;stroke-width:2;cursor:pointer;pointer-events:auto;rx:4;vector-effect:non-scaling-stroke}.bbox-rect:hover,.bbox-rect.active{fill:rgba(245,158,11,.25);stroke:#f59e0b;stroke-width:3}
.gallery-bar{background:rgba(30,41,59,.85);border-top:1px solid var(--border-color);display:flex;gap:8px;padding:8px 12px;overflow-x:auto;min-height:76px}.gallery-item{height:58px;min-width:46px;max-width:90px;object-fit:cover;border:2px solid var(--border-color);border-radius:6px;cursor:pointer;opacity:.75}.gallery-item.active{border-color:var(--warning);opacity:1}.gallery-item.rendered{box-shadow:0 0 0 2px var(--success)}
.bottom-actions{position:absolute;right:18px;bottom:18px;z-index:30;display:flex;gap:10px;padding:8px;background:rgba(15,23,42,.88);border:1px solid var(--border-color);border-radius:10px;backdrop-filter:blur(8px)}
.sidebar{width:420px;background:var(--bg-panel);border-left:1px solid var(--border-color);display:flex;flex-direction:column}.sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between}.sidebar-title{font-size:15px;font-weight:700}.badge-count{background:var(--accent);color:#fff;font-size:11px;padding:2px 8px;border-radius:12px}.sidebar-content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.item-card{background:var(--bg-dark);border:1px solid var(--border-color);border-radius:10px;padding:12px 14px}.item-card.active{border-color:var(--warning);box-shadow:0 0 0 2px rgba(245,158,11,.3)}.item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.item-actions{display:flex;gap:4px}.btn-icon{background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:5px;border-radius:4px}.btn-icon:hover{color:#fff;background:var(--bg-card)}.original-text{font-size:13px;color:var(--text-muted);background:rgba(255,255,255,.03);padding:8px 10px;border-radius:6px;margin-bottom:10px;border-left:3px solid var(--accent);word-break:break-word}.translation-input{width:100%;background:#0f172a;border:1px solid var(--border-color);border-radius:6px;padding:10px 12px;color:#fff;font-size:14px;font-family:'Noto Sans Bengali',sans-serif;resize:vertical;min-height:48px;outline:none}.input-tip{font-size:11px;color:var(--text-muted);margin-top:4px;display:flex;justify-content:space-between}.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;color:var(--text-muted)}
.spinner-overlay{position:absolute;inset:0;background:rgba(15,23,42,.8);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;opacity:0;pointer-events:none}.spinner-overlay.show{opacity:1;pointer-events:auto}.spinner{width:40px;height:40px;border:4px solid rgba(99,102,241,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.sidebar{width:340px}.bottom-actions{right:12px;bottom:12px}.stage-view{padding:12px}}
</style>
</head>
<body>
<header>
<div class="brand"><div class="brand-icon">🎨</div><div class="brand-title"><h1>Toon Translation Studio</h1><p>কার্টুন ইমেজ অনুবাদ স্টুডিও (Bulk & Manual Workflow)</p></div></div>
<div class="header-actions">
<input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFileSelect(event)">
<button class="btn" onclick="document.getElementById('fileInput').click()">📁 ছবি সিলেক্ট করুন</button>
<button class="btn" onclick="autoTranslateAll()">✨ অটো অনুবাদ</button>
</div>
</header>
<div class="app-container">
<div class="stage-container">
<div class="stage-toolbar">
<div class="view-toggle"><button class="toggle-btn active" id="btnOriginal" onclick="switchView('original')">মূল কার্টুন</button><button class="toggle-btn" id="btnRendered" onclick="switchView('rendered')">অনুবাদিত কার্টুন</button></div>
<div class="zoom-controls"><button class="zoom-btn" onclick="changeZoom(-.1)">−</button><button class="zoom-level" id="zoomLevelText" onclick="setZoom(1)">100%</button><button class="zoom-btn" onclick="changeZoom(.1)">+</button><button class="zoom-btn" onclick="fitImage()">Fit</button><button class="zoom-btn" onclick="setZoom(1)">100%</button></div>
<div id="imageCounterText" style="font-size:12px;color:var(--text-muted)">কোনো ছবি লোড করা হয়নি</div>
</div>
<div class="stage-view" id="stageView">
<div class="spinner-overlay" id="spinner"><div class="spinner"></div><p id="spinnerText" style="margin-top:12px">প্রসেসিং করা হচ্ছে...</p></div>
<div class="multi-canvas" id="multiCanvas" style="display:none"></div>
<div class="empty-state" id="emptyState"><div style="font-size:48px">🖼️</div><h3>কার্টুন ছবি আপলোড করুন</h3></div>
</div>
<div class="gallery-bar" id="galleryBar" style="display:none"></div>
<div class="bottom-actions"><button class="btn btn-primary" id="renderButton" onclick="renderImage()">⚡ রেন্ডার</button><button class="btn btn-success" id="downloadButton" onclick="downloadAll()">💾 সব ডাউনলোড</button></div>
</div>
<div class="sidebar"><div class="sidebar-header"><div class="sidebar-title">ডিটেক্ট/সিলেক্ট করা টেক্সট <span class="badge-count" id="detectionCount">0</span></div><div style="font-size:11px;color:var(--text-muted)">Bubble click = select</div></div><div class="sidebar-content" id="sidebarContent"><div class="empty-state"><div style="font-size:48px">💬</div><p>ছবি সিলেক্ট করার পর bubble-এ ক্লিক করুন</p></div></div></div>
</div>
<script>
let imageList=[],currentIndex=-1,activeView='original',zoomLevel=1,fitMode=false,selectedId=null;
function showSpinner(t){document.getElementById('spinnerText').innerText=t;document.getElementById('spinner').classList.add('show')}function hideSpinner(){document.getElementById('spinner').classList.remove('show')}
function setZoom(z){zoomLevel=Math.max(.25,Math.min(3,z));fitMode=false;applyZoom()}function changeZoom(d){setZoom(Math.round((zoomLevel+d)*100)/100)}function fitImage(){fitMode=true;applyZoom()}
function applyZoom(){if(!imageList.length)return;const sv=document.getElementById('stageView');const pages=[...document.querySelectorAll('.page-wrapper')];if(!pages.length)return;let scale=zoomLevel;if(fitMode){const maxW=Math.max(1,sv.clientWidth-48),first=pages[0].querySelector('img');if(first&&first.naturalWidth)scale=Math.min(maxW/first.naturalWidth,3);scale=Math.max(.1,Math.min(3,scale))}pages.forEach(p=>{const img=p.querySelector('img');if(!img.naturalWidth)return;p.style.width=img.naturalWidth*scale+'px';p.style.height=img.naturalHeight*scale+'px';img.style.width=img.naturalWidth*scale+'px';img.style.height=img.naturalHeight*scale+'px'});document.getElementById('zoomLevelText').innerText=fitMode?'Fit':Math.round(zoomLevel*100)+'%'}
function switchView(v){activeView=v;document.getElementById('btnOriginal').classList.toggle('active',v==='original');document.getElementById('btnRendered').classList.toggle('active',v==='rendered');renderPages()}
function renderPages(){const box=document.getElementById('multiCanvas');box.innerHTML='';if(!imageList.length)return;imageList.forEach((item,i)=>{const page=document.createElement('div');page.className='page-wrapper';page.dataset.index=i;const img=document.createElement('img');img.draggable=false;img.src=activeView==='rendered'&&item.renderedUrl?item.renderedUrl:item.url;img.onload=()=>applyZoom();page.appendChild(img);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('overlay-svg');page.appendChild(svg);page.onclick=e=>{if(e.target===img||e.target===page)setCurrentImage(i)};box.appendChild(page);renderPageOverlay(i,svg)});applyZoom()}
function renderPageOverlay(index,svg){svg.innerHTML='';const d=imageList[index]?.detections||[];d.forEach(x=>{const b=x.bbox;if(!b||b.length<4)return;const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',b[0]);r.setAttribute('y',b[1]);r.setAttribute('width',Math.max(0,b[2]-b[0]));r.setAttribute('height',Math.max(0,b[3]-b[1]));r.setAttribute('class','bbox-rect '+(index===currentIndex&&x.id===selectedId?'active':''));r.onclick=e=>{e.stopPropagation();setCurrentImage(index);selectItem(x.id)};svg.appendChild(r)})}
function renderOverlay(){document.querySelectorAll('.page-wrapper').forEach((p,i)=>{const svg=p.querySelector('svg');if(svg)renderPageOverlay(i,svg)})}
function setCurrentImage(i){if(i<0||i>=imageList.length)return;currentIndex=i;selectedId=null;document.getElementById('imageCounterText').innerText='ছবি '+(i+1)+' / '+imageList.length;renderSidebar();renderOverlay();document.querySelectorAll('.gallery-item').forEach((el,n)=>el.classList.toggle('active',n===i))}
function selectItem(id){selectedId=id;renderSidebar();renderOverlay();const el=document.getElementById('card-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})}
function deleteItem(id){const item=imageList[currentIndex];item.detections=(item.detections||[]).filter(x=>x.id!==id);item.detections.forEach((x,i)=>x.id=i);selectedId=null;renderSidebar();renderOverlay()}
function renderSidebar(){const box=document.getElementById('sidebarContent');const d=imageList[currentIndex]?.detections||[];document.getElementById('detectionCount').innerText=d.length;if(!d.length){box.innerHTML='<div class="empty-state"><div style="font-size:48px">💬</div><p>Bubble-এ ক্লিক করে selection যোগ করুন</p></div>';return}box.innerHTML=d.map((x,i)=>`<div class="item-card ${x.id===selectedId?'active':''}" id="card-${x.id}" data-id="${x.id}"><div class="item-header"><b>Bubble ${i+1}</b><div class="item-actions"><button class="btn-icon" onclick="selectItem(${x.id})">🎯</button><button class="btn-icon" onclick="deleteItem(${x.id})" title="Delete">🗑️</button></div></div><div class="original-text">${escapeHtml(x.text||'Manual bubble')}</div><textarea class="translation-input" id="tr-${x.id}" placeholder="বাংলা অনুবাদ লিখুন...">${escapeHtml(x.translation||'')}</textarea><div class="input-tip"><span>এই bubble-এর মধ্যে auto-fit হবে</span><span>Enter → next</span></div></div>`).join('');d.forEach(x=>{const el=document.getElementById('tr-'+x.id);el.addEventListener('input',()=>x.translation=el.value);el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const next=document.getElementById('tr-'+(x.id+1));if(next)next.focus()}})})}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function updateGallery(){const bar=document.getElementById('galleryBar');bar.innerHTML='';if(imageList.length<2){bar.style.display='none';return}bar.style.display='flex';imageList.forEach((item,i)=>{const img=document.createElement('img');img.className='gallery-item '+(i===currentIndex?'active ':'')+(item.renderedUrl?'rendered':'');img.src=item.renderedUrl||item.url;img.title=item.file.name;img.onclick=()=>setCurrentImage(i);bar.appendChild(img)})}
function handleFileSelect(e){const files=[...e.target.files];if(!files.length)return;imageList.forEach(x=>{if(x.url)URL.revokeObjectURL(x.url);if(x.renderedUrl)URL.revokeObjectURL(x.renderedUrl)});imageList=files.map(file=>({file,url:URL.createObjectURL(file),detections:[],renderedUrl:null}));currentIndex=0;activeView='original';selectedId=null;document.getElementById('multiCanvas').style.display='flex';document.getElementById('emptyState').style.display='none';document.getElementById('btnOriginal').classList.add('active');document.getElementById('btnRendered').classList.remove('active');renderPages();updateGallery();setCurrentImage(0);document.getElementById('fileInput').value=''}
async function autoTranslateAll(){const work=imageList.filter(x=>(x.detections||[]).length);if(!work.length)return;showSpinner('সব ছবির অনুবাদ চলছে...');try{for(const item of work){const d=item.detections||[];const r=await fetch('/api/auto-translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texts:d.map(x=>x.text||'')})});const data=await r.json();d.forEach((x,i)=>x.translation=data.translations?.[i]||'')}renderSidebar()}catch(e){alert('Translation error: '+e.message)}finally{hideSpinner()}}
async function renderImage(){if(currentIndex<0)return;const item=imageList[currentIndex];const d=(item.detections||[]).filter(x=>(x.translation||'').trim());if(!d.length){alert('আগে অন্তত একটি বাংলা অনুবাদ লিখুন।');return}showSpinner('কার্টুন রেন্ডার হচ্ছে...');try{const fd=new FormData();fd.append('file',item.file);fd.append('items_json',JSON.stringify(d));const r=await fetch('/api/render',{method:'POST',body:fd});if(!r.ok)throw new Error(await r.text());const blob=await r.blob();if(item.renderedUrl)URL.revokeObjectURL(item.renderedUrl);item.renderedUrl=URL.createObjectURL(blob);activeView='rendered';document.getElementById('btnOriginal').classList.remove('active');document.getElementById('btnRendered').classList.add('active');renderPages();updateGallery()}catch(e){console.error(e);alert('Render error: '+e.message)}finally{hideSpinner()}}
async function downloadAll(){const rendered=imageList.filter(x=>x.renderedUrl);if(!rendered.length){alert('আগে অন্তত একটি ছবি Render করুন।');return}if(rendered.length===1){const item=rendered[0];const a=document.createElement('a');a.href=item.renderedUrl;a.download=(item.file.name.replace(/\.[^.]+$/,'')||'translated')+'-translated.png';document.body.appendChild(a);a.click();a.remove();return}if(typeof JSZip==='undefined'){alert('ZIP library load হয়নি। Internet connection check করুন।');return}showSpinner('সব rendered image ZIP করা হচ্ছে...');try{const zip=new JSZip();for(const item of rendered){const res=await fetch(item.renderedUrl);const blob=await res.blob();const name=(item.file.name.replace(/\.[^.]+$/,'')||'translated')+'-translated.png';zip.file(name,blob)}const blob=await zip.generateAsync({type:'blob'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='translated-images.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){console.error(e);alert('Download error: '+e.message)}finally{hideSpinner()}}
window.addEventListener('resize',()=>{if(fitMode)applyZoom()});
</script>
</body>
</html>
