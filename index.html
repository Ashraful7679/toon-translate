<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toon Translation Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>:root{--bg:#0f172a;--p:#1e293b;--c:#334155;--b:#475569;--a:#6366f1;--t:#f8fafc;--m:#94a3b8;--w:#f59e0b;--g:#10b981}*{box-sizing:border-box;margin:0;font-family:Inter,'Noto Sans Bengali',sans-serif}body{height:100vh;overflow:hidden;background:var(--bg);color:var(--t);display:flex;flex-direction:column}header{padding:12px 24px;background:#1e293a;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.brand-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center}.brand-title h1{font-size:18px}.brand-title p{font-size:12px;color:var(--m)}.btn{background:var(--c);color:#fff;border:1px solid var(--b);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}.primary{background:linear-gradient(135deg,#6366f1,#4f46e5);border:0}.success{background:linear-gradient(135deg,#10b981,#059669);border:0}.app{display:flex;flex:1;min-height:0}.stage{flex:1;min-width:0;display:flex;flex-direction:column;background:#090d16;position:relative}.toolbar{padding:8px 16px;background:#1e293a88;border-bottom:1px solid var(--b);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toggle{border:0;background:transparent;color:var(--m);padding:6px 12px;border-radius:6px;cursor:pointer}.toggle.active{background:var(--a);color:#fff}.zoom{display:flex;gap:4px}.zoom button{height:30px;min-width:30px;background:var(--bg);color:#fff;border:1px solid var(--b);border-radius:6px}.stage-view{flex:1;overflow:auto;padding:24px;position:relative;scroll-behavior:smooth}.canvas{width:max-content;min-width:100%;display:flex;flex-direction:column;align-items:center}.page{position:relative;line-height:0;margin:0;touch-action:none;box-shadow:0 20px 40px #0009}.page img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}.svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.shape{pointer-events:auto;cursor:move;fill:#6366f122;stroke:#818cf8;stroke-width:2;vector-effect:non-scaling-stroke}.shape.manual{fill:#10b9811a;stroke:#10b981}.shape.sel{fill:#f59e0b33;stroke:#f59e0b;stroke-width:3}.handle{pointer-events:auto;fill:#fff;stroke:#f59e0b;stroke-width:2;vector-effect:non-scaling-stroke;cursor:nwse-resize}.tool-on .page,.tool-on .page img{cursor:crosshair}.hint{display:none;position:sticky;top:8px;left:50%;transform:translateX(-50%);background:#0f172af5;border:1px solid var(--w);padding:7px 12px;border-radius:8px;font-size:12px;z-index:20;width:max-content}.tool-on .hint{display:block}.gallery{min-height:76px;padding:8px 12px;display:flex;gap:8px;overflow:auto;background:#1e293add;border-top:1px solid var(--b)}.thumb{height:58px;min-width:46px;max-width:90px;object-fit:cover;border:2px solid var(--b);border-radius:6px;opacity:.7;cursor:pointer}.thumb.active{border-color:var(--w);opacity:1}.thumb.rendered{box-shadow:0 0 0 2px var(--g)}.actions{position:absolute;right:18px;bottom:18px;z-index:30;display:flex;gap:10px;padding:8px;background:#0f172ae8;border:1px solid var(--b);border-radius:10px}.side{width:420px;background:var(--p);border-left:1px solid var(--b);display:flex;flex-direction:column;min-height:0}.sidehead{padding:16px 20px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between}.count{background:var(--a);padding:2px 8px;border-radius:12px;font-size:11px}.sidebody{flex:1;overflow:auto;padding:16px}.card{background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px;cursor:pointer}.card.active{border-color:var(--w);box-shadow:0 0 0 2px #f59e0b44}.cardhead{display:flex;justify-content:space-between;align-items:center}.card button{background:0;border:0;color:var(--m);cursor:pointer;font-size:16px}.orig{font-size:12px;color:var(--m);padding:8px;margin:8px 0;background:#ffffff08;border-left:3px solid var(--a);word-break:break-word}textarea{width:100%;min-height:50px;background:#0b1220;color:#fff;border:1px solid var(--b);border-radius:6px;padding:10px;font:14px 'Noto Sans Bengali',sans-serif}.tip{font-size:10px;color:var(--m);margin-top:4px;display:flex;justify-content:space-between}.empty{padding:45px 20px;text-align:center;color:var(--m)}.spinner{position:absolute;inset:0;z-index:50;background:#0f172acc;display:grid;place-items:center;opacity:0;pointer-events:none}.spinner.show{opacity:1;pointer-events:auto}.loader{width:40px;height:40px;border:4px solid #6366f133;border-top-color:var(--a);border-radius:50%;animation:s .8s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:900px){.side{width:340px}.stage-view{padding:12px}.actions{right:12px;bottom:12px}}</style></head><body><header><div class="brand"><div class="brand-icon">🎨</div><div class="brand-title"><h1>Toon Translation Studio</h1><p>কার্টুন ইমেজ অনুবাদ স্টুডিও</p></div></div><div><input id="fileInput" type="file" accept="image/*" multiple hidden><button class="btn" id="choose">📁 ছবি সিলেক্ট করুন</button><button class="btn" id="autoTr">✨ অটো অনুবাদ</button></div></header><div class="app"><main class="stage"><div class="toolbar"><div><button id="origBtn" class="toggle active">মূল কার্টুন</button><button id="rendBtn" class="toggle">অনুবাদিত কার্টুন</button></div><div class="zoom"><button id="minus">−</button><button id="ztext">100%</button><button id="plus">+</button><button id="fit">Fit</button><button id="one">100%</button></div><button id="bubbleToolBtn" class="btn primary">🪄 Bubble Tool: ON</button><span id="counter" style="font-size:12px;color:var(--m)">কোনো ছবি লোড করা হয়নি</span></div><div id="stageView" class="stage-view"><div class="hint">Click = auto-select • Drag = custom bubble • Drag selected = move • Corner = resize</div><div id="spinner" class="spinner"><div><div class="loader"></div><p id="spinText" style="margin-top:12px">প্রসেসিং...</p></div></div><div id="canvas" class="canvas"></div><div id="empty" class="empty">🖼️<h3>কার্টুন ছবি আপলোড করুন</h3></div></div><div id="gallery" class="gallery" style="display:none"></div><div class="actions"><button id="renderBtn" class="btn primary">⚡ রেন্ডার</button><button id="downloadBtn" class="btn success">💾 সব ডাউনলোড</button></div></main><aside class="side"><div class="sidehead"><b>সব সিলেক্টেড বাবল <span id="count" class="count">0</span></b><span style="font-size:11px;color:var(--m)">সব ছবি</span></div><div id="sidebar" class="sidebody"></div></aside></div><script>
const $=id=>document.getElementById(id);let images=[],idx=-1,view='original',z=1,fitMode=false,tool=true,selectedKey=null,act=null,seq=0;
const uid=()=>crypto.randomUUID?crypto.randomUUID():'b'+Date.now()+Math.random().toString(36).slice(2);const cur=()=>images[idx];
function spin(t){$('spinText').textContent=t;$('spinner').classList.add('show')}function unspin(){$('spinner').classList.remove('show')}
function zoomSet(v){z=Math.max(.25,Math.min(3,v));fitMode=false;applyZoom()}function applyZoom(){if(!images.length)return;let max=Math.max(1,$('stageView').clientWidth-48);document.querySelectorAll('.page').forEach(p=>{let im=p.querySelector('img');if(!im.naturalWidth)return;let s=fitMode?Math.min(max/im.naturalWidth,3):z;s=Math.max(.1,Math.min(3,s));p.style.width=im.naturalWidth*s+'px';p.style.height=im.naturalHeight*s+'px';im.style.width=im.naturalWidth*s+'px';im.style.height=im.naturalHeight*s+'px'});$('ztext').textContent=fitMode?'Fit':Math.round(z*100)+'%'}
function point(e,im){let r=im.getBoundingClientRect();return{x:Math.max(0,Math.min(im.naturalWidth,(e.clientX-r.left)*im.naturalWidth/r.width)),y:Math.max(0,Math.min(im.naturalHeight,(e.clientY-r.top)*im.naturalHeight/r.height))}}
function pages(){ $('canvas').innerHTML='';images.forEach((it,i)=>{let p=document.createElement('div');p.className='page';p.dataset.i=i;let im=document.createElement('img');im.draggable=false;im.src=view==='rendered'&&it.renderedUrl?it.renderedUrl:it.url;im.onload=()=>{it.w=im.naturalWidth;it.h=im.naturalHeight;applyZoom()};p.append(im);let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('svg');p.append(svg);p.onpointerdown=e=>down(e,i,im,p);p.onpointermove=e=>move(e,i,im);p.onpointerup=e=>up(e,i,im);p.onpointercancel=()=>{act=null;draw()};p.onclick=()=>{if(!tool)setImage(i)};$('canvas').append(p);drawPage(i,svg)});applyZoom()}
function drawPage(i,svg){svg.innerHTML='';let it=images[i];if(!it)return;let im=$('canvas').querySelector('.page[data-i="'+i+'"] img'),w=im?.naturalWidth||it.w||1,h=im?.naturalHeight||it.h||1;svg.setAttribute('viewBox','0 0 '+w+' '+h);(it.detections||[]).forEach(d=>{let b=d.bbox,[x0,y0,x1,y1]=b,el=document.createElementNS('http://www.w3.org/2000/svg',d.shape==='ellipse'?'ellipse':'rect');if(d.shape==='ellipse'){el.setAttribute('cx',(x0+x1)/2);el.setAttribute('cy',(y0+y1)/2);el.setAttribute('rx',(x1-x0)/2);el.setAttribute('ry',(y1-y0)/2)}else{el.setAttribute('x',x0);el.setAttribute('y',y0);el.setAttribute('width',x1-x0);el.setAttribute('height',y1-y0);el.setAttribute('rx',4)}el.classList.add('shape');if(d.manual)el.classList.add('manual');if(i===idx&&key(i,d.id)===selectedKey)el.classList.add('sel');el.onpointerdown=e=>shapeDown(e,i,d,im);el.onclick=e=>{e.stopPropagation();selectBubble(i,d.id,true)};svg.append(el);if(i===idx&&key(i,d.id)===selectedKey)handles(svg,d)})}
function handles(svg,d){let b=d.bbox,hs=[[b[0],b[1],'nw'],[b[2],b[1],'ne'],[b[0],b[3],'sw'],[b[2],b[3],'se']];hs.forEach(([x,y,pos])=>{let h=document.createElementNS('http://www.w3.org/2000/svg','circle');h.classList.add('handle');h.setAttribute('cx',x);h.setAttribute('cy',y);h.setAttribute('r',6);h.dataset.h=pos;h.onpointerdown=e=>{e.stopPropagation();e.preventDefault();let im=$('canvas').querySelector('.page[data-i="'+idx+'"] img');act={type:'resize',id:d.id,pos,start:point(e,im),orig:d.bbox.slice(),i:idx};h.setPointerCapture?.(e.pointerId)};svg.append(h)})}
function draw(){document.querySelectorAll('.page').forEach((p,i)=>drawPage(i,p.querySelector('.svg')))}
function key(i,id){return i+'::'+id}
function selectBubble(i,id,scroll){idx=i;selectedKey=key(i,id);$('counter').textContent='ছবি '+(i+1)+' / '+images.length;galleryUpdate();sidebar();draw();if(scroll){let page=$('canvas').querySelector('.page[data-i="'+i+'"]');page?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});setTimeout(()=>{let el=page?.querySelector('[data-bubble="'+CSS.escape(id)+'"]');el?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'})},150)}}
function setImage(i){if(i<0||i>=images.length)return;idx=i;selectedKey=null;$('counter').textContent='ছবি '+(i+1)+' / '+images.length;sidebar();draw();galleryUpdate()}
function shapeDown(e,i,d,im){if(!tool||i!==idx)return;e.stopPropagation();e.preventDefault();selectedKey=key(i,d.id);act={type:'move',id:d.id,start:point(e,im),orig:d.bbox.slice(),i};e.currentTarget.setPointerCapture?.(e.pointerId);sidebar();draw()}
function down(e,i,im,p){if(!tool||i!==idx||e.button!==0||e.target.closest('.shape,.handle'))return;e.preventDefault();let q=point(e,im);act={type:'draw',start:q,current:q,i};p.setPointerCapture?.(e.pointerId)}
function move(e,i,im){if(!act||act.i!==i)return;let q=point(e,im);if(act.type==='draw'){act.current=q;preview(i,act.start,q,e.shiftKey);return}let d=cur()?.detections.find(x=>x.id===act.id);if(!d)return;let [a,b,c,dd]=act.orig,dx=q.x-act.start.x,dy=q.y-act.start.y,box;if(act.type==='move')box=[a+dx,b+dy,c+dx,dd+dy];else{let x0=a,y0=b,x1=c,y1=dd;if(act.pos.includes('n'))y0=q.y;if(act.pos.includes('s'))y1=q.y;if(act.pos.includes('w'))x0=q.x;if(act.pos.includes('e'))x1=q.x;if(x1-x0<12)x1=x0+12;if(y1-y0<12)y1=y0+12;box=[Math.min(x0,x1),Math.min(y0,y1),Math.max(x0,x1),Math.max(y0,y1)]}box[0]=Math.max(0,box[0]);box[1]=Math.max(0,box[1]);box[2]=Math.min(cur().w,box[2]);box[3]=Math.min(cur().h,box[3]);d.bbox=box;drawPage(i,$('canvas').querySelector('.page[data-i="'+i+'"] .svg'))}
function up(e,i,im){if(!act||act.i!==i)return;if(act.type==='draw'){let s=act.start,q=point(e,im);act=null;let x1=q.x,y1=q.y;if(e.shiftKey){let side=Math.max(Math.abs(q.x-s.x),Math.abs(q.y-s.y));x1=s.x+(q.x>=s.x?side:-side);y1=s.y+(q.y>=s.y?side:-side)}let b=[Math.round(Math.min(s.x,x1)),Math.round(Math.min(s.y,y1)),Math.round(Math.max(s.x,x1)),Math.round(Math.max(s.y,y1))];if(b[2]-b[0]>=12&&b[3]-b[1]>=12){let d={id:uid(),seq:++seq,text:'Manual bubble',conf:1,bbox:b,polygon:[],translation:'',shape:'ellipse',manual:true};cur().detections.push(d);selectedKey=key(i,d.id);sidebar()}draw()}else{act=null;draw()}}
function preview(i,s,q,circle){let svg=$('canvas').querySelector('.page[data-i="'+i+'"] .svg');if(!svg)return;drawPage(i,svg);let x=q.x,y=q.y;if(circle){let side=Math.max(Math.abs(q.x-s.x),Math.abs(q.y-s.y));x=s.x+(q.x>=s.x?side:-side);y=s.y+(q.y>=s.y?side:-side)}let e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');e.classList.add('shape','manual','sel');e.style.pointerEvents='none';e.setAttribute('cx',(s.x+x)/2);e.setAttribute('cy',(s.y+y)/2);e.setAttribute('rx',Math.abs(x-s.x)/2);e.setAttribute('ry',Math.abs(y-s.y)/2);svg.append(e)}
async function autoAt(e){let im=$('canvas').querySelector('.page[data-i="'+idx+'"] img'),q=point(e,im),fd=new FormData();fd.append('file',cur().file);fd.append('x',Math.round(q.x));fd.append('y',Math.round(q.y));spin('বাবল সিলেক্ট করা হচ্ছে...');try{let r=await fetch('/api/select-bubble',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw Error(d.detail||'not found');let b=d.bbox,exists=cur().detections.some(x=>{let ix=Math.max(0,Math.min(x.bbox[2],b[2])-Math.max(x.bbox[0],b[0])),iy=Math.max(0,Math.min(x.bbox[3],b[3])-Math.max(x.bbox[1],b[1]));return ix*iy>.8*Math.min((x.bbox[2]-x.bbox[0])*(x.bbox[3]-x.bbox[1]),(b[2]-b[0])*(b[3]-b[1]))});if(!exists){let n={id:uid(),seq:++seq,text:d.text||'',conf:d.confidence||d.conf||1,bbox:b,polygon:d.polygon||[],translation:'',shape:'rect',manual:false};cur().detections.push(n);selectedKey=key(idx,n.id);sidebar();draw()}}catch(err){alert('এই জায়গায় অটো বাবল পাওয়া যায়নি। Drag করে custom bubble আঁকুন।')}finally{unspin()}}
$('canvas').addEventListener('click',e=>{if(!tool)return;let p=e.target.closest?.('.page');if(p&&Number(p.dataset.i)===idx&&!e.target.closest('.shape,.handle'))autoAt(e)});
function allBubbles(){return images.flatMap((it,i)=>(it.detections||[]).map(d=>({it,i,d}))).sort((a,b)=>(a.d.seq||0)-(b.d.seq||0))}
function sidebar(){let list=allBubbles();$('count').textContent=list.length;if(!list.length){$('sidebar').innerHTML='<div class="empty">💬<p>Bubble Tool চালু আছে। যেকোনো ছবিতে click বা drag করুন।</p></div>';return}$('sidebar').innerHTML=list.map((o,n)=>{let d=o.d;return `<div class="card ${key(o.i,d.id)===selectedKey?'active':''}" data-card="${o.i}::${d.id}"><div class="cardhead"><b>#${n+1} • ছবি ${o.i+1} • ${d.manual?'Custom':'Auto'} Bubble</b><button data-del="${o.i}::${d.id}">🗑️</button></div><div class="orig">${esc(d.text||'Bubble')} • ${Math.round(d.bbox[2]-d.bbox[0])} × ${Math.round(d.bbox[3]-d.bbox[1])} px</div><textarea data-tr="${o.i}::${d.id}" placeholder="বাংলা অনুবাদ লিখুন...">${esc(d.translation||'')}</textarea><div class="tip"><span>Drag = move • corner = resize</span><span>Enter = next</span></div></div>`}).join('');$('sidebar').querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();let [i,id]=b.dataset.del.split('::'),it=images[+i];it.detections=it.detections.filter(d=>d.id!==id);if(selectedKey===key(+i,id))selectedKey=null;sidebar();draw()});$('sidebar').querySelectorAll('[data-card]').forEach(c=>c.onclick=e=>{if(e.target.closest('textarea,button'))return;let [i,id]=c.dataset.card.split('::');selectBubble(+i,id,true)});$('sidebar').querySelectorAll('[data-tr]').forEach(t=>{t.oninput=()=>{let [i,id]=t.dataset.tr.split('::'),d=images[+i]?.detections.find(x=>x.id===id);if(d)d.translation=t.value};t.onfocus=()=>{let [i,id]=t.dataset.tr.split('::');selectBubble(+i,id,true)};t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();let a=[...$('sidebar').querySelectorAll('[data-tr]')],n=a.indexOf(t)+1;if(a[n])a[n].focus()}}})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function galleryUpdate(){if(images.length<2){$('gallery').style.display='none';return}$('gallery').style.display='flex';$('gallery').innerHTML='';images.forEach((it,i)=>{let im=document.createElement('img');im.className='thumb '+(i===idx?'active ':'')+(it.renderedUrl?'rendered':'');im.src=it.renderedUrl||it.url;im.title=it.file.name;im.onclick=()=>setImage(i);$('gallery').append(im)})}
$('choose').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{let fs=[...e.target.files];if(!fs.length)return;images.forEach(x=>{URL.revokeObjectURL(x.url);if(x.renderedUrl)URL.revokeObjectURL(x.renderedUrl)});seq=0;images=fs.map(file=>({file,url:URL.createObjectURL(file),renderedUrl:null,detections:[],w:0,h:0}));idx=0;selectedKey=null;tool=true;view='original';$('origBtn').classList.add('active');$('rendBtn').classList.remove('active');$('empty').style.display='none';$('canvas').style.display='flex';$('stageView').classList.add('tool-on');pages();galleryUpdate();setImage(0);e.target.value=''};
$('bubbleToolBtn').onclick=()=>{tool=!tool;$('bubbleToolBtn').textContent=tool?'🪄 Bubble Tool: ON':'🪄 Bubble Tool: OFF';$('stageView').classList.toggle('tool-on',tool);if(!tool){act=null;draw()}};
$('origBtn').onclick=()=>{view='original';$('origBtn').classList.add('active');$('rendBtn').classList.remove('active');pages()};$('rendBtn').onclick=()=>{view='rendered';$('rendBtn').classList.add('active');$('origBtn').classList.remove('active');pages()};$('minus').onclick=()=>zoomSet(z-.1);$('plus').onclick=()=>zoomSet(z+.1);$('one').onclick=()=>zoomSet(1);$('ztext').onclick=()=>zoomSet(1);$('fit').onclick=()=>{fitMode=true;applyZoom()};window.onresize=()=>{if(fitMode)applyZoom()};window.onkeydown=e=>{if(e.key==='Escape'){tool=false;act=null;$('stageView').classList.remove('tool-on');$('bubbleToolBtn').textContent='🪄 Bubble Tool: OFF';draw()}};
$('autoTr').onclick=async()=>{if(!images.length)return;spin('সব ছবির অনুবাদ চলছে...');try{for(let it of images){if(!it.detections.length)continue;let r=await fetch('/api/auto-translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texts:it.detections.map(d=>d.text||'')})}),d=await r.json();it.detections.forEach((x,i)=>x.translation=d.translations?.[i]||'')}sidebar()}catch(e){alert('Translation error: '+e.message)}finally{unspin()}};
$('renderBtn').onclick=async()=>{let it=cur(),list=it?.detections.filter(d=>(d.translation||'').trim());if(!it||!list?.length){alert('আগে অন্তত একটি বাংলা অনুবাদ লিখুন।');return}spin('কার্টুন রেন্ডার হচ্ছে...');try{let fd=new FormData();fd.append('file',it.file);fd.append('items_json',JSON.stringify(list));let r=await fetch('/api/render',{method:'POST',body:fd});if(!r.ok)throw Error(await r.text());let b=await r.blob();if(it.renderedUrl)URL.revokeObjectURL(it.renderedUrl);it.renderedUrl=URL.createObjectURL(b);view='rendered';$('origBtn').classList.remove('active');$('rendBtn').classList.add('active');pages();galleryUpdate()}catch(e){alert('Render error: '+e.message)}finally{unspin()}};
$('downloadBtn').onclick=async()=>{let rs=images.filter(x=>x.renderedUrl);if(!rs.length){alert('আগে অন্তত একটি ছবি Render করুন।');return}if(rs.length===1){let a=document.createElement('a');a.href=rs[0].renderedUrl;a.download=rs[0].file.name.replace(/\.[^.]+$/,'')+'-translated.png';a.click();return}spin('সব rendered image ZIP করা হচ্ছে...');try{let zip=new JSZip();for(let it of rs)zip.file(it.file.name.replace(/\.[^.]+$/,'')+'-translated.png',await(await fetch(it.renderedUrl)).blob());let a=document.createElement('a');a.href=URL.createObjectURL(await zip.generateAsync({type:'blob'}));a.download='translated-images.zip';a.click()}catch(e){alert('Download error: '+e.message)}finally{unspin()}};sidebar();
</script></body></html>
